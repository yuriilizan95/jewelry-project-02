<section class="contacts section" id="contacts">
  <div class="container contacts-container">
    <p class="contacts-subtitle">Connect</p>
    <h2 class="contacts-title">Order your unique jewelry</h2>
    <p class="contacts-text">We'd love to hear more details from you!</p>

    <div class="contacts-wrap">
      <address class="contacts-address">
        <ul class="contacts-address-list">
          <li class="contacts-address-item">
            <svg
              class="contacts-address-svg"
              width="27"
              height="22"
              aria-hidden="true"
            >
              <use href="/img/sprite.svg#envelope-icon"></use>
            </svg>
            <p class="contacts-address-text">Email</p>
            <div>
              <a
                class="contacts-address-link"
                href="mailto:info@handmadejewelry.com"
                >info@handmadejewelry.com</a
              >
            </div>
          </li>

          <li class="contacts-address-item">
            <svg
              class="contacts-address-svg"
              width="26"
              height="26"
              aria-hidden="true"
            >
              <use href="/img/sprite.svg#phone-icon"></use>
            </svg>
            <p class="contacts-address-text">Phone</p>
            <div>
              <a class="contacts-address-link" href="tel:+15550000000"
                >+1 (555) 000-0000</a
              >
            </div>
          </li>

          <li class="contacts-address-item">
            <svg
              class="contacts-address-svg"
              width="22"
              height="27"
              aria-hidden="true"
            >
              <use href="/img/sprite.svg#map-icon"></use>
            </svg>
            <p class="contacts-address-text">Office</p>
            <div>
              <a
                class="contacts-address-link"
                href="https://maps.app.goo.gl/cbRAUroPFJQw8KHa9"
                target="_blank"
                rel="noopener noreferrer"
                ><span>76-8 Oakington Manor Dr,</span>
                <span>London, UK</span></a
              >
            </div>
          </li>
        </ul>
      </address>

      <form class="contacts-form" action="#" method="POST">
        <div class="contacts-form-inner">
          <label class="contacts-form-label" for="user-name">Name*</label>
          <input
            class="contacts-form-input"
            type="text"
            name="user-name"
            id="user-name"
            placeholder="Tony"
            pattern="^[a-zA-Z\s\.]{5,28}$"
            required
          />
          <p class="text-invalid">Enter name of 5 characters</p>
        </div>

        <div class="contacts-form-inner">
          <label class="contacts-form-label" for="user-phone">Phone*</label>
          <input
            class="contacts-form-input"
            type="tel"
            name="user-phone"
            id="user-phone"
            placeholder="+1 234 567 8900"
            pattern="^\+[0-9\s]{14}$"
            required
          />
          <p class="text-invalid">Enter in the format +1 234 567 8900</p>
        </div>

        <div class="contacts-form-inner">
          <label class="contacts-form-label" for="user-comment"
            >Describe what you want</label
          >
          <textarea
            class="contacts-form-comment"
            name="user-comment"
            id="user-comment"
            maxlength="500"
            placeholder="Type your message..."
          ></textarea>
        </div>

        <button class="contacts-form-btn btn" type="submit">Submit</button>
      </form>
    </div>
  </div>
</section>
